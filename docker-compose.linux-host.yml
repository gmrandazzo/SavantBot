services:
  redis:
    image: redis/redis-stack:latest
    network_mode: host
    # Ports are not needed in host mode as they map directly to host ports
    volumes:
      - redis_data:/data

  api:
    build: .
    command: savant-api
    network_mode: host
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://localhost:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./src:/app/src

  bot:
    build: .
    command: savant-bot
    network_mode: host
    env_file:
      - .env
    environment:
      - API_URL=http://localhost:8124/chat
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./src:/app/src

volumes:
  redis_data:
