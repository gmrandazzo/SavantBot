services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6390:6379"
      - "8003:8001"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: savant-api
    ports:
      - "8125:8124"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./src:/app/src

  bot:
    build: .
    command: savant-bot
    env_file:
      - .env
    environment:
      - API_URL=http://api:8124/chat
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./src:/app/src

volumes:
  redis_data:
